[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-cost-analyzer"
version = "0.3.0"
description = "Evidence-aware SaaS spend, entitlement, activity, and renewal governance with CCAC output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diana Molski", email = "polush@gmail.com" }]
keywords = ["finops", "saas", "focus", "billing", "cost", "cli", "salesforce", "snowflake", "slack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "black>=26,<27",
    "flake8>=7,<8",
    "isort>=6,<7",
    "pip-audit>=2.10,<3",
    "pytest>=8,<9",
]

[project.scripts]
saas-cost = "saas_cost_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/cloudandcapital/saas-cost-analyzer"
Repository = "https://github.com/cloudandcapital/saas-cost-analyzer.git"
"Bug Tracker" = "https://github.com/cloudandcapital/saas-cost-analyzer/issues"

[tool.hatch.version]
path = "saas_cost_analyzer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["./saas_cost_analyzer"]

[tool.hatch.build]
exclude = ["**/* 2.*"]

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"
