name: PR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run black --check saas_cost_analyzer tests
      - run: uv run isort --check-only saas_cost_analyzer tests
      - run: uv run flake8 saas_cost_analyzer tests --count --select=E9,F63,F7,F82,F401 --show-source --statistics
      - run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uv run pip-audit --cache-dir /tmp/pip-audit-cache --requirement /tmp/runtime-requirements.txt

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/ -q

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv build --out-dir dist
      - run: |
          python -m venv package-smoke
          uv pip install --python package-smoke/bin/python dist/*.whl
          package-smoke/bin/saas-cost --version
      - run: |
          package-smoke/bin/saas-cost ccac --demo > demo-1.json
          package-smoke/bin/saas-cost ccac --demo > demo-2.json
          cmp demo-1.json demo-2.json
